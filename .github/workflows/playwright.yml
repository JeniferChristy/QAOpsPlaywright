name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Run Playwright tests
      env:
        PLAYWRIGHT_SERVICE_URL: ${{ vars.PLAYWRIGHT_SERVICE_URL }}
        ECOM_EMAIL: ${{ secrets.ECOM_EMAIL }}
        ECOM_PASSWORD: ${{ secrets.ECOM_PASSWORD }}
        ECOM_PRACTICE_PASSWORD: ${{ secrets.ECOM_PRACTICE_PASSWORD }}
        EVENTHUB_YAHOO_EMAIL: ${{ secrets.EVENTHUB_YAHOO_EMAIL }}
        EVENTHUB_YAHOO_PASSWORD: ${{ secrets.EVENTHUB_YAHOO_PASSWORD }}
        EVENTHUB_GMAIL_EMAIL: ${{ secrets.EVENTHUB_GMAIL_EMAIL }}
        EVENTHUB_GMAIL_PASSWORD: ${{ secrets.EVENTHUB_GMAIL_PASSWORD }}
      run: npx playwright test --config=playwright.service.config.js --workers=4
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
